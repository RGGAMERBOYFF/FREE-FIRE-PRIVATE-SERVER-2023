<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RG GAMER BOY FF</title>

<style>
  *{box-sizing:border-box}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:#000; color:#fff;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{min-height:100vh;overflow-x:hidden}

  .page{
    display:none;
    min-height:100vh;
    padding:24px 24px 48px;
    background:#000;
  }
  .page.active{display:block}

  .wrap{
    width:100%;
    max-width:680px;
    margin:0 auto;
    text-align:center;
  }

  .profile{
    width:132px;height:132px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:18px auto 24px;
    border:3px solid #fff;
    box-shadow:0 0 24px rgba(255,255,255,.20);
  }

  h1{
    margin:0 0 18px;
    font-size:32px;
    line-height:1.15;
    font-weight:700;
  }

  .subtitle{
    margin:0 0 58px;
    color:#cfcfcf;
    font-size:24px;
    line-height:1.2;
  }

  h2{
    margin:0 0 28px;
    font-size:25px;
    line-height:1.2;
    font-weight:700;
  }

  .buttons{
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  .btn{
    width:100%;
    min-height:82px;
    border:0;
    border-radius:22px;
    background:#9b91f5;
    color:#111;
    text-decoration:none;
    display:flex;
    align-items:center;
    padding:8px 16px;
    font-size:20px;
    font-weight:700;
    line-height:1.12;
    box-shadow:0 8px 22px rgba(155,145,245,.18);
    transition:transform .15s ease,filter .15s ease;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .btn:active{
    transform:scale(.985);
    filter:brightness(.94);
  }

  .btn img{
    width:62px;height:62px;
    border-radius:50%;
    object-fit:cover;
    flex:0 0 62px;
    margin-right:16px;
  }

  .btn .label{
    flex:1;
    text-align:center;
    padding-right:8px;
  }

  /* Discord: blue circular background with white Discord mark */
  .discord{
    justify-content:center;
    gap:15px;
  }
  .discord .label{
    flex:initial;
    padding:0;
  }
  .discord-icon{
    width:62px;height:62px;
    flex:0 0 62px;
    display:block;
  }

  /* Android / Apple icons on the download buttons */
  .platform{
    width:38px;height:38px;
    flex:0 0 38px;
    margin-left:10px;
    display:block;
  }

  .back{
    width:100%;
    border:2px solid #cfcfcf;
    background:#222;
    color:#fff;
    border-radius:42px;
    padding:17px 20px;
    font-size:21px;
    font-weight:600;
    margin:0 0 30px;
    cursor:pointer;
    box-shadow:0 0 18px rgba(255,255,255,.10);
    -webkit-tap-highlight-color:transparent;
  }

  .back:active{transform:scale(.99)}

  @media(max-width:420px){
    .page{padding:24px 24px 38px}

    .profile{
      width:126px;height:126px;
      margin-top:18px;
    }

    h1{font-size:30px}
    .subtitle{font-size:22px;margin-bottom:55px}
    h2{font-size:23px}

    .btn{
      min-height:76px;
      padding:7px 12px;
      font-size:18px;
    }

    .btn img{
      width:58px;height:58px;
      flex-basis:58px;
      margin-right:12px;
    }

    .discord-icon{
      width:58px;height:58px;
      flex-basis:58px;
    }

    .platform{
      width:34px;height:34px;
      flex-basis:34px;
      margin-left:7px;
    }
  }
</style>
</head>

<script>
  function showPage(id){
    document.querySelectorAll('.page').forEach(page => {
      page.classList.remove('active');
    });

    const target = document.getElementById(id);
    if(target) target.classList.add('active');

    window.scrollTo(0,0);
    history.replaceState(null, '', id === 'downloads' ? '#downloads' : '#home');
  }

  if(location.hash === '#downloads'){
    showPage('downloads');
  }
</script>
